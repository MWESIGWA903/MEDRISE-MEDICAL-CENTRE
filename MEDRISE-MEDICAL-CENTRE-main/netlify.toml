[build]
  base = "."
  command = "pnpm install && pnpm --filter @workspace/medrise run build"
  publish = "artifacts/medrise/dist/public"

[build.environment]
  NODE_VERSION = "20"
  NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
  PNPM_FLAGS = "--shamefully-hoist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200